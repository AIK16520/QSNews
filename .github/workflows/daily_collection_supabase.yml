name: Daily Collection (Supabase)

on:
  schedule:
    # Run daily at 10 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📰 Fetch RSS Articles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          USE_SUPABASE: true
        run: |
          echo "Fetching articles from RSS feeds..."
          python src/main.py fetch

      - name: 🔄 Process RSS Articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          USE_SUPABASE: true
        run: |
          echo "Processing articles..."
          python src/main.py process

      - name: 📧 Fetch Gmail Newsletters
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSLETTER_GMAIL: ${{ secrets.NEWSLETTER_GMAIL }}
          NEWSLETTER_PASS: ${{ secrets.NEWSLETTER_PASS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          USE_SUPABASE: true
        run: |
          echo "Fetching newsletters from Gmail..."
          python src/main.py fetch-newsletters

      - name: 📝 Generate Review Report
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          USE_SUPABASE: true
        run: |
          echo "Generating review report..."
          python src/main.py generate-review

      - name: Commit outputs (optional - only if needed)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add outputs/
          git diff --staged --quiet || git commit -m "📊 Update reports: $(date +'%Y-%m-%d %H:%M UTC')"
          git push


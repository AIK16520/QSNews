name: Daily Collection - Articles & Newsletters

on:
  schedule:
    # Run daily at 10 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  collect-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📰 Fetch RSS Articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USE_SUPABASE: true
        run: |
          echo "Fetching articles from RSS feeds..."
          python src/main.py fetch

      - name: 🔄 Process RSS Articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USE_SUPABASE: true
        run: |
          echo "Processing articles..."
          python src/main.py process

      - name: 📧 Fetch Gmail Newsletters
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSLETTER_GMAIL: ${{ secrets.NEWSLETTER_GMAIL }}
          NEWSLETTER_PASS: ${{ secrets.NEWSLETTER_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USE_SUPABASE: true
        run: |
          echo "Fetching newsletters from Gmail..."
          python src/main.py fetch-newsletters

      - name: 🗂️ Scrape Newsletter Archives (Monday only)
        if: github.event.schedule == '0 10 * * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.include_archives == 'true')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USE_SUPABASE: true
        run: |
          echo "Scraping newsletter archives..."
          python src/main.py scrape-newsletter-archives

      - name: 📊 Summary
        run: |
          echo "✅ Daily collection complete!"
          echo "- RSS articles fetched and processed"
          echo "- Gmail newsletters collected"
          echo "- All data saved to Supabase"


name: Daily Newsletter Collection

on:
  schedule:
    # Run daily at 10 AM UTC
    - cron: '0 10 * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-newsletters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database (if needed)
        env:
          DATABASE_PATH: data/articles.db
        run: python src/main.py init-db

      - name: Fetch newsletters from Gmail
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSLETTER_GMAIL: ${{ secrets.NEWSLETTER_GMAIL }}
          NEWSLETTER_PASS: ${{ secrets.NEWSLETTER_PASS }}
          DATABASE_PATH: data/articles.db
        run: python src/main.py fetch-newsletters

      - name: Scrape newsletter archives (weekly only)
        # Only run archive scraping on Mondays to avoid rate limits
        if: github.event.schedule == '0 9 * * 1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_PATH: data/articles.db
        run: python src/main.py scrape-newsletter-archives

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/articles.db
          git diff --staged --quiet || git commit -m "📧 Update newsletters: $(date +'%Y-%m-%d %H:%M UTC')"
          git push
